services:
  - type: web
    name: bot-management-store
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SELLER_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CATALOG_PATH
        value: catalog.json
      - key: CURRENCY
        value: ARS
      - key: SHOP_NAME
        value: Nombre de tu marca
      - key: ORDER_RESERVATION_HOURS
        value: "24"
      - key: WEBHOOK_MODE
        value: "true"
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
